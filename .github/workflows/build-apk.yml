name: Build OTP Admin APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up JDK 17 (required by Android Gradle Plugin 8.x)
        uses: actions/setup-java@v5
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      # NOTE: ubuntu-latest runners already ship the Android SDK, so we
      # install only the packages this project needs instead of using
      # android-actions/setup-android@v3 (it tries to install the
      # long-removed "tools" package and fails with exit code 1,
      # plus it still runs on Node 20 which is deprecated).
      # sdkmanager is NOT on PATH by default, so resolve it via
      # ANDROID_HOME / ANDROID_SDK_ROOT explicitly.
      - name: Install Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          fi
          echo "Using sdkmanager at: $SDKMANAGER"
          "$SDKMANAGER" --install "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          yes | "$SDKMANAGER" --licenses > /dev/null || true

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Decode persistent release keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        shell: bash
        env:
          KEYSTORE_B64: ${{ env.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/otp-release.jks"

      - name: Build signed admin release APK
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/otp-release.jks
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Require persistent release signing
        if: ${{ env.ANDROID_KEYSTORE_BASE64 == '' }}
        run: |
          echo "Missing ANDROID_KEYSTORE_BASE64 and release signing secrets."
          echo "Refusing to publish a debug-signed APK because it cannot reliably update an installed build."
          exit 1

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: otp-admin-apk
          path: build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/**/*.apk
          generate_release_notes: true
