name: Build OTP Admin APK

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17 (required by Android Gradle Plugin 8.x)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.7"

      - name: Build admin debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload admin APK
        uses: actions/upload-artifact@v4
        with:
          name: otp-admin-apk
          path: build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/outputs/apk/debug/*.apk
          generate_release_notes: true
